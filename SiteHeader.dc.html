<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:6px;background:#B5674B"></div>
<header style="background:#FBF8F3;border-bottom:1px solid #E6DBCD;font-family:'Jost',sans-serif;font-weight:300">
  <div style="max-width:1200px;margin:0 auto;padding:22px clamp(20px,5vw,56px) 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
    <div style="flex:1 1 120px"></div>
    <a href="/" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#3A2F2A;text-align:center;text-decoration:none">
      <span style="font-family:'Cormorant Garamond',serif;font-size:clamp(26px,3.4vw,36px);letter-spacing:0.08em;line-height:1">AÇUCENNA ABREU</span>
      <span style="font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#7A6A5E">Psicóloga • CRP 11/26124</span>
    </a>
    <div style="flex:1 1 120px;display:flex;justify-content:flex-end;align-items:center;gap:10px">
      <a href="{{ wa }}" target="_blank" aria-label="WhatsApp" title="WhatsApp" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #E0CFC2;border-radius:50%;color:#A85A3D" style-hover="border-color:#A85A3D;color:#7E4029">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7L4 20z"></path></svg>
      </a>
      <a href="https://www.instagram.com/psi.assucennaabreu/" target="_blank" aria-label="Instagram" title="@psi.assucennaabreu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #E0CFC2;border-radius:50%;color:#A85A3D" style-hover="border-color:#A85A3D;color:#7E4029">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="4" width="16" height="16" rx="4.5"></rect><circle cx="12" cy="12" r="3.6"></circle><circle cx="16.8" cy="7.2" r="0.6" fill="currentColor"></circle></svg>
      </a>
      <a href="{{ wa }}" target="_blank" style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#A85A3D;border:1px solid #C99A84;padding:10px 16px;white-space:nowrap;text-decoration:none" style-hover="background:#A85A3D;color:#FFFFFF">Agendar consulta</a>
    </div>
  </div>
  <nav aria-label="Principal" style="border-top:1px solid #EFE6DA">
    <div style="max-width:900px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;justify-content:center;column-gap:clamp(16px,3vw,34px);row-gap:6px;font-size:13px;letter-spacing:0.04em">
      <a href="/" style="color:#3A2F2A;text-decoration:none">Início</a>
      <a href="/sobre" style="color:#3A2F2A;text-decoration:none">Sobre mim</a>
      <a href="/#atendimentos" style="color:#3A2F2A;text-decoration:none">Atendimentos</a>
      <a href="/#como-funciona" style="color:#3A2F2A;text-decoration:none">Como funciona</a>
      <a href="/conteudos" style="color:#3A2F2A;text-decoration:none">Conteúdos</a>
      <a href="/#contato" style="color:#3A2F2A;text-decoration:none">Contato</a>
    </div>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;150px&quot;}}">
class Component extends DCLogic {
  componentDidMount() { if (!window.SITE) this._t = setInterval(() => { if (window.SITE) { clearInterval(this._t); this.forceUpdate(); } }, 50); }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() { return { wa: (window.SITE && window.SITE.WHATSAPP_URL) || '#' }; }
}
</script>
</body>
</html>
